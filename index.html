

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SUPABASE_URL = 'https://qdssmmkffgazadmzeixq.supabase.co';

const SUPABASE_KEY = 'sb_publishable_B9gVhNPqbg9Qt-C1jgs-Ow_ybMJCfYE';

const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

let produtos = [];
let carrinho = [];
let categoriaAtual = "Todos";

function dinheiro(valor) {
  return Number(valor).toLocaleString("pt-BR", {
    style: "currency",
    currency: "BRL"
  });
}

function mostrarProdutos() {
  const lista = document.getElementById("listaProdutos");
  lista.innerHTML = "";

  const busca = document.getElementById("pesquisa").value.toLowerCase();

  const filtrados = produtos.filter(produto => {
    const combinaNome = produto.nome.toLowerCase().includes(busca);
    const combinaCategoria =
      categoriaAtual === "Todos" ||
      produto.categoria === categoriaAtual;

    return combinaNome && combinaCategoria;
  });

  if (filtrados.length === 0) {
    lista.textContent = "Nenhum produto encontrado.";
    return;
  }

  filtrados.forEach(produto => {
    const card = document.createElement("div");
    card.className = "produto";

    const imagem = document.createElement("div");
    imagem.className = "foto";

    if (produto.imagem_url) {
      const img = document.createElement("img");
      img.src = produto.imagem_url;
      img.alt = produto.nome;
      img.style.width = "100%";
      img.style.height = "120px";
      img.style.objectFit = "contain";
      imagem.appendChild(img);
    } else {
      imagem.textContent = "📦";
    }

    const nome = document.createElement("h3");
    nome.textContent = produto.nome;

    const preco = document.createElement("p");
    preco.className = "preco";
    preco.textContent = dinheiro(produto.preco);

    const botao = document.createElement("button");
    botao.textContent = "Adicionar ao carrinho";
    botao.addEventListener("click", () => adicionarCarrinho(produto));

    card.append(imagem, nome, preco, botao);
    lista.appendChild(card);
  });
}

async function carregarProdutos() {
  const lista = document.getElementById("listaProdutos");
  lista.textContent = "Carregando produtos...";

  const { data, error } = await supabase
    .from("produtos")
    .select("*")
    .eq("ativo", true)
    .order("criado_em", { ascending: false });

  if (error) {
    console.error("Erro ao buscar produtos:", error);
    lista.textContent = "Não foi possível carregar os produtos.";
    return;
  }

  produtos = data || [];
  mostrarProdutos();
}

function filtrar() {
  mostrarProdutos();
}

function filtrarCategoria(categoria) {
  categoriaAtual = categoria;
  mostrarProdutos();
  document.getElementById("produtos").scrollIntoView({
    behavior: "smooth"
  });
}

function adicionarCarrinho(produto) {
  carrinho.push(produto);
  document.getElementById("quantidade").textContent = carrinho.length;
  alert("Produto adicionado ao carrinho!");
}

function verCarrinho() {
  if (carrinho.length === 0) {
    alert("Seu carrinho está vazio!");
    return;
  }

  let total = 0;
  let mensagem = "SEU CARRINHO:\n\n";

  carrinho.forEach(produto => {
    mensagem += produto.nome + " - " + dinheiro(produto.preco) + "\n";
    total += Number(produto.preco);
  });

  mensagem += "\nTOTAL: " + dinheiro(total);
  alert(mensagem);
}

// Mantém os botões e campos do HTML funcionando.
window.filtrar = filtrar;
window.filtrarCategoria = filtrarCategoria;
window.verCarrinho = verCarrinho;

carregarProdutos();
</script>
